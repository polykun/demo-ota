name: Temporary build JFC signal workbook

on:
  push:
    branches:
      - temp-signal-delivery-260801
    paths:
      - 'tools/build_signal.py'
      - '.github/workflows/temp-build-signal.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-signal-delivery-260801
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --upgrade pip lxml
      - name: Build workbook
        run: python tools/build_signal.py
      - name: Commit workbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signal_piquant.xlsm
          if git diff --cached --quiet; then
            echo 'No workbook changes.'
          else
            git commit -m 'Generate completed signal workbook'
            git push origin HEAD:temp-signal-delivery-260801
          fi
